<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* Песочница блока «Контакты» (8.12–8.13, 23.11). Основной сайт не трогает.
   Центр у всех вариантов один: заголовок + 4 кнопки (главное действие блока — связаться / скопировать почту),
   картинки никогда не заходят на кнопки. Картинки — заглушки из assets/, список — в ITEMS ниже (готово к админке). */
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:16px/1.4 var(--text);color:#fff;background:#163d9c;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:none;-webkit-user-drag:none;user-select:none}
:root{--sky-1:#071f72;--sky-2:#163d9c;--sky-3:#4c79c2}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(130% 100% at 50% 45%,rgba(10,14,40,0) 65%,rgba(10,14,40,.18) 100%),linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 58%,var(--sky-3) 100%)}
.sky__clouds{position:absolute;inset:0;width:100%;height:100%}

/* Перед блоком — кусочек «Обо мне», чтобы было видно, как в блок въезжаешь скроллом */
.before{height:46vh;display:grid;place-items:end center;padding-bottom:40px;color:rgba(255,255,255,.55);font:500 13px/1 var(--mono)}

/* ── Блок ── */
.ct{position:relative;height:max(100vh,760px);overflow:hidden;isolation:isolate}
.ct__fx{position:absolute;inset:0;z-index:1}
.ct__core{position:absolute;left:50%;top:46%;z-index:20;transform:translate(-50%,-50%);width:760px;text-align:center;pointer-events:none}
.ct__h{font:400 104px/.88 var(--display);white-space:nowrap;letter-spacing:-.02em;text-transform:uppercase;text-shadow:0 6px 30px rgba(4,16,70,.25)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:440px;margin:34px auto 0;pointer-events:auto}
.btn{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 10px 0 20px;border-radius:18px;
  font:600 15px/1 var(--text);background:rgba(255,255,255,.14);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.32),inset 0 0 24px rgba(255,255,255,.1),0 10px 30px rgba(4,20,80,.18);transition:background .2s,transform .2s var(--ease)}
.btn i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);font-style:normal;font-size:15px}
.btn:hover{background:rgba(255,255,255,.24);transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.btn svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:1.8}
.toast{position:fixed;left:50%;bottom:30px;z-index:95;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Карточки и предметы — общие для всех вариантов */
.it{position:absolute;left:0;top:0;will-change:transform,opacity;pointer-events:none}
.it--photo,.it--frame,.it--card{border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 14px 30px rgba(4,20,80,.25)}
.it--photo img{width:100%;height:100%;object-fit:cover}
.it--frame{background:rgba(255,255,255,.14)}
.it--frame img{position:absolute;left:50%;bottom:0;width:112%;transform:translateX(-50%)}
.it--cut img{width:100%;height:auto;filter:drop-shadow(0 12px 16px rgba(4,20,80,.3))}
.it--card{background:rgba(255,255,255,.16);display:grid;place-items:center}
.it--card img{width:86%;height:86%;object-fit:contain}
.it--card.is-photo img{width:100%;height:100%;object-fit:cover}
.spark{position:absolute;left:0;top:0;width:26px;height:26px;pointer-events:none}
.spark path{fill:#fff}

/* 1 · Орбита (её набросок 172:4148) */
.orbit-line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.orbit-line ellipse{fill:none;stroke:rgba(255,255,255,.28);stroke-width:1.5}
.v-orbit .ct__fx{cursor:grab}.v-orbit .ct__fx.drag{cursor:grabbing}

/* 2 · Дуга */
.v-arc .ct__fx{cursor:grab}.v-arc .ct__fx.drag{cursor:grabbing}
.v-arc.arc-top .ct__core{top:58%}

/* 4 · Полёт: контакты + футер вместе, при скролле летим сквозь поле фото */
.v-fall .ct{height:260vh;overflow:visible}
.v-fall .ct__pin{position:sticky;top:0;height:100vh;overflow:hidden}
.ct__pin{position:relative;height:100%}
.v-fall .ct__fx{perspective:800px;perspective-origin:50% 44%}
.v-fall .it{left:50%;top:44%}
.foot{display:none}
.v-fall .foot{display:flex;position:absolute;left:0;right:0;bottom:0;z-index:25;align-items:center;gap:40px;padding:22px 48px 26px;
  background:linear-gradient(180deg,rgba(7,31,114,0),rgba(7,31,114,.55));font:500 14px/1.5 var(--text)}
.foot img{width:190px;height:auto}
.foot nav{display:flex;gap:22px;color:rgba(255,255,255,.85)}
.foot .sp{flex:1}
.foot__cv{height:40px;display:inline-flex;align-items:center;padding:0 18px;border-radius:20px;background:var(--lime);color:var(--ink);font-weight:600}
.foot__up{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-weight:600}
.foot small{position:absolute;left:48px;bottom:6px;font-size:11px;color:rgba(255,255,255,.5)}

/* Орбита v2: карточки «как у Apple» — фото во всю карточку, большое скругление, мягкая длинная тень, без рамки */
.it--apple{border-radius:30px;overflow:hidden;background:linear-gradient(180deg,#dfe9ff,#b9cdf5);box-shadow:0 26px 50px -20px rgba(4,16,64,.55),0 2px 6px rgba(4,16,64,.12)}
.it--apple img{width:100%;height:100%;object-fit:cover}
.it--apple.is-cutout img{object-fit:contain;object-position:50% 100%}
/* Дуга v2: без подложки — фото скруглённые, предметы вырезаны */
.it--bare{translate:-50% -50%}
.it--bare.is-photo{border-radius:22px;overflow:hidden;box-shadow:0 20px 40px -18px rgba(4,16,64,.5)}
.it--bare img{width:100%;height:auto;filter:drop-shadow(0 14px 18px rgba(4,16,64,.28))}
.it--bare.is-photo img{filter:none}
/* 5 · Подвес (по её референсу: предмет на верёвке, небо, трава) */
.v-hang .ct__fx{z-index:21;pointer-events:none}
.v-hang .ct__core{top:19%}
.v-hang .ct__h{font-size:150px;line-height:.84}
.v-hang .ct__core .btns{display:none}
.ground{position:absolute;left:0;right:0;bottom:0;z-index:0;width:100%;height:38%;object-fit:cover;object-position:50% 70%;-webkit-mask:linear-gradient(transparent,#000 38%);mask:linear-gradient(transparent,#000 38%);pointer-events:none}
.hang{position:absolute;left:50%;top:-8px;width:640px;margin-left:-320px;transform-origin:50% 0;pointer-events:none;will-change:transform}
.hang__rope{display:block;width:640px;overflow:visible}
.hang__rope path{fill:none;stroke:var(--lime);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hang__win{position:relative;border-radius:28px;overflow:hidden;pointer-events:auto;
  background:rgba(3,56,158,.08);backdrop-filter:blur(8px) saturate(1.15);-webkit-backdrop-filter:blur(8px) saturate(1.15);
  box-shadow:inset 0 0 72px rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.55),0 30px 50px -16px rgba(0,10,60,.45)}
.hang__top{height:30px;display:flex;align-items:center;gap:6px;padding:0 22px;position:relative;font-size:12px;font-weight:500}
.hang__top i{width:8px;height:8px;border-radius:50%;background:#ff5f57}.hang__top i:nth-child(2){background:#febc2e}.hang__top i:nth-child(3){background:#28c840}
.hang__top span{position:absolute;left:0;right:0;text-align:center}
.hang__eyes{position:relative;height:160px;overflow:hidden}
.hang__eyes img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.22);transform-origin:50% 60%}
.hang__bot{padding:12px 14px 14px}
.hang__bot .btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:auto;margin:0}
.hang__bot .btn{height:40px;padding:0 6px 0 14px;border-radius:20px;background:#fff;color:var(--ink);font:500 14px/1 var(--mono);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.hang__bot .btn i{width:28px;height:28px;background:rgba(3,56,158,.08);font-size:13px}
.hang__bot .btn svg{stroke:var(--ink)}
.hang__bot .btn:hover{background:#f2f5ff}

/* Служебная панель вариантов — со шевроном «свернуть» (её правило) */
.pick{position:fixed;left:16px;bottom:16px;z-index:90;display:flex;flex-wrap:wrap;align-items:center;gap:4px;max-width:calc(100vw - 32px);padding:5px;border-radius:16px;
  background:rgba(11,20,60,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);font:500 13px/1 var(--text)}
.pick__x{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:16px;transition:transform .25s}
.pick.min .pick__x{transform:rotate(180deg)}
.pick.min > :not(.pick__x){display:none}
.pick span{padding:0 8px 0 4px;color:rgba(255,255,255,.6)}
.pick button:not(.pick__x){height:32px;padding:0 12px;border-radius:12px}
.pick button[aria-pressed=true]{background:#fff;color:var(--ink)}
.pick i{width:1px;align-self:stretch;margin:4px;background:rgba(255,255,255,.2)}
.pick p{flex-basis:100%;padding:6px 8px 4px;color:rgba(255,255,255,.7);font-size:12px;line-height:1.4;max-width:620px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<script src="js/sky.js?v=11230410"></script>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  Sky([{ sel: '#contacts', d: .5, low: 1, pal: { sky: ['#071f72', '#163d9c', '#4c79c2'], L: '#f8efe0', H: '#9aa3c2' } }]);

  /* Контент. ЗАГЛУШКИ из assets/ — заменить на её 8–12 картинок (плёнка, глина, концепты, плакаты, фотик).
     kind: photo — фото целиком; frame — вырезанный человек (в карточке стоит на подложке); cut — предмет без фона. */
  const A = n => `assets/${n}.webp`;
  const ITEMS = [
    { src: 'contacts-photo', kind: 'frame', alt: 'Валя с котами' },
    { src: 'web-obj-camera', kind: 'cut', alt: 'Плёночная мыльница' },
    { src: 'deck-photo', kind: 'photo', alt: 'Портрет' },
    { src: 'in-stat', kind: 'cut', alt: 'Концепт статистики' },
    { src: 'web-obj-flower', kind: 'cut', alt: 'Керамика' },
    { src: 'subs-card', kind: 'photo', alt: 'Концепт подписчиков' },
    { src: 'in-path', kind: 'cut', alt: 'Концепт онбординга' },
    { src: 'hero-photo', kind: 'cut', alt: 'Портрет' },
    { src: 'in-car', kind: 'cut', alt: 'Концепт карусели' },
    { src: 'case1-card', kind: 'cut', alt: 'Концепт' }
  ].map(o => ({ ...o, url: A(o.src) }));
  /* Орбита: карточки (фото) и «разрядка» между ними — керамика, фотик, ✦ */
  const ORBIT = [
    { card: 'deck-photo' }, { spark: 1 }, { card: 'contacts-photo', cutout: 1 }, { obj: 'web-obj-flower', w: 120 },
    { card: 'case1-cover' }, { spark: 1 }, { card: 'hero-photo' }, { obj: 'web-obj-camera', w: 150 },
    { card: 'carousel-cover' }, { spark: 1 }, { card: 'case2-cover' }
  ];

  const DESC = {
    orbit: 'Твой набросок 172:4148, v2: карточки «как у Apple» — фото во всю карточку, большое скругление, мягкая тень, без рамки. Между ними воздух и разрядка: керамика, фотик, ✦. Крутятся сами, скролл докручивает, можно тянуть мышью.',
    arc: 'Дуга v2: картинки без подложки — фото скруглённые, предметы вырезаны. Едут сами; чем дольше скроллишь вниз, тем быстрее разгоняются, потом плавно тормозят. Можно тянуть с инерцией. Сверху или снизу — кнопкой справа.',
    fall: 'Полёт (Infinite Scroll Fall): контакты и футер — один экран. Пока скроллишь, летим вперёд сквозь поле фото, дальние тонут в «тумане» цвета неба, коридор по центру свободен. Внизу страницы полёт продолжается колесом и сам по себе.',
    hang: 'Подвес — по твоему референсу (предмет на верёвке, небо, трава): в финале на лаймовой верёвке висит окно «Валя.app» с глазами, контакты — в его нижней панели. Качается само, скролл раскачивает, глаза смотрят на курсор. Рифма с первым экраном.'
  };

  const fx = $('#fx'), body = document.body, core = $('.ct__core'), btns = $('.btns');
  const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
  const img = src => { const i = new Image(); i.src = src; i.alt = ''; i.decoding = 'async'; return i; };
  const card = (it, kind = it.kind, w = 170, h = w) => { const d = el('div', 'it it--' + kind + (it.kind === 'photo' ? ' is-photo' : ''));
    d.style.width = w + 'px'; if (kind !== 'cut' && kind !== 'bare') d.style.height = h + 'px';
    d.appendChild(img(it.url)); d.dataset.w = w; d.dataset.h = h; return d; };
  const SPARK = '<svg viewBox="0 0 26 26" class="spark"><path d="M13 0c.9 7.2 5 11.6 13 13-8 1.4-12.1 5.8-13 13-.9-7.2-5-11.6-13-13 8-1.4 12.1-5.8 13-13z"/></svg>';
  const box = () => fx.getBoundingClientRect();
  const visible = () => { const r = $('#contacts').getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight; };

  /* Перетаскивание с инерцией (только по пустому небу; кнопки остаются кнопками) */
  const dragger = (onMove) => { let on = false, lx = 0, lt = 0, v = 0;
    const down = e => { on = true; lx = e.clientX; lt = performance.now(); v = 0; fx.setPointerCapture(e.pointerId); fx.classList.add('drag'); };
    const move = e => { if (!on) return; const dx = e.clientX - lx, now = performance.now(); v = dx / Math.max(8, now - lt); lx = e.clientX; lt = now; onMove(dx); };
    const up = () => { on = false; fx.classList.remove('drag'); };
    fx.addEventListener('pointerdown', down); fx.addEventListener('pointermove', move); fx.addEventListener('pointerup', up); fx.addEventListener('pointercancel', up);
    return { inertia: dt => { if (on) return 0; v *= Math.pow(.94, dt / 16); return Math.abs(v) > .002 ? v * dt : 0; },
      off: () => { fx.removeEventListener('pointerdown', down); fx.removeEventListener('pointermove', move); fx.removeEventListener('pointerup', up); fx.removeEventListener('pointercancel', up); } }; };
  /* Скорость скролла, пока блок на экране (px за кадр, сглажено) */
  const scrollVel = () => { let sy = scrollY, v = 0; const on = () => { const d = scrollY - sy; sy = scrollY; if (visible()) v += d; };
    addEventListener('scroll', on, { passive: true }); return { take: () => { const t = v; v = 0; return t; }, off: () => removeEventListener('scroll', on) }; };

  const V = {};

  /* 1 · Орбита v2 */
  V.orbit = () => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'orbit-line');
    const ell = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse'); svg.appendChild(ell); fx.appendChild(svg);
    const nodes = ORBIT.map((o, i) => {
      if (o.spark) { const s = el('div'); s.innerHTML = SPARK; const n = s.firstChild; fx.appendChild(n); return { n, spark: true }; }
      if (o.obj) { const n = card({ url: A(o.obj), kind: 'cut' }, 'cut', o.w); n.dataset.rot = i % 2 ? 10 : -8; fx.appendChild(n); return { n, obj: true, w: o.w }; }
      const n = el('div', 'it it--apple' + (o.cutout ? ' is-cutout' : '')); n.style.width = '196px'; n.style.height = '252px'; n.appendChild(img(A(o.card))); fx.appendChild(n); return { n, w: 196, h: 252 }; });
    const N = nodes.length, step = Math.PI * 2 / N, TILT = -5 * Math.PI / 180;
    let ang = 0, last = performance.now(), raf; const dr = dragger(dx => { ang += dx * .003; }), sv = scrollVel();
    const frame = now => { const dt = Math.min(50, now - last); last = now; if (!reduce) ang += dt * (Math.PI * 2 / 90000); ang += dr.inertia(dt) * .003 + sv.take() * .0014;
      const b = box(), cx = b.width / 2, cy = b.height * .52, rx = Math.min(b.width * .41, 630), ry = b.height * .3;
      ell.setAttribute('cx', cx); ell.setAttribute('cy', cy); ell.setAttribute('rx', rx); ell.setAttribute('ry', ry); ell.setAttribute('transform', `rotate(${TILT * 180 / Math.PI} ${cx} ${cy})`);
      const c = Math.cos(TILT), s = Math.sin(TILT);
      nodes.forEach((o, i) => { const a = ang + i * step, ex = rx * Math.sin(a), ey = ry * Math.cos(a), x = cx + ex * c - ey * s, y = cy + ex * s + ey * c,
          d = Math.cos(a), k = (d + 1) / 2, sc = .46 + .62 * k;
        o.n.style.zIndex = d > -.1 ? 30 + Math.round(d * 10) : 5 + Math.round((d + 1) * 4);
        if (o.spark) { o.n.style.transform = `translate(${x - 13}px,${y - 13}px) scale(${.6 + .7 * k})`; o.n.style.opacity = (.3 + .7 * k).toFixed(3); return; }
        const w = o.w, h = o.h || w;
        o.n.style.transform = o.obj ? `translate(${x - w / 2}px,${y - h / 2}px) rotate(${o.n.dataset.rot}deg) scale(${sc})`
          : `translate(${x - w / 2}px,${y - h / 2}px) perspective(900px) rotateY(${(Math.sin(a) * 16).toFixed(2)}deg) scale(${sc})`;
        o.n.style.opacity = (.16 + .84 * k * k).toFixed(3);
        o.n.style.filter = d < -.3 ? `blur(${((-d - .3) * 3).toFixed(1)}px)` : ''; });
      raf = requestAnimationFrame(frame); };
    raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); dr.off(); sv.off(); };
  };

  /* 2 · Дуга v2: без подложки, скролл разгоняет */
  let arcTop = false;
  V.arc = () => {
    const list = [...ITEMS, ...ITEMS], W = 176, GAP = 46, P = W + GAP, L = list.length * P, R = 1500;
    const nodes = list.map(it => { const n = card(it, 'bare', W); fx.appendChild(n); return n; });
    let O = 0, vel = 0, last = performance.now(), raf; const dr = dragger(dx => { O += dx; }), sv = scrollVel();
    const frame = now => { const dt = Math.min(50, now - last); last = now;
      vel += Math.abs(sv.take()) * .9;                 // скролл (в любую сторону) подталкивает ленту
      vel *= Math.pow(.96, dt / 16); vel = Math.min(vel, 60); // плавное торможение и потолок скорости
      if (!reduce) O -= dt * .03 + vel * dt / 16; O += dr.inertia(dt);
      const b = box(), cx = b.width / 2, top = arcTop, cy = top ? b.height * .17 - R : b.height * .84 + R;
      nodes.forEach((n, i) => { const p = ((i * P + O) % L + L) % L - L / 2, th = p / R, x = cx + R * Math.sin(th), y = top ? cy + R * Math.cos(th) : cy - R * Math.cos(th),
          e = Math.min(1, Math.abs(x - cx) / (b.width / 2 + 60)), sc = 1 - .32 * e * e;
        n.style.transform = `translate(${x}px,${y}px) rotate(${(top ? -th : th) * 180 / Math.PI}deg) scale(${sc})`;
        n.style.opacity = Math.max(0, 1 - .9 * e * e * e).toFixed(3); n.style.visibility = e >= 1 ? 'hidden' : ''; });
      raf = requestAnimationFrame(frame); };
    raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); dr.off(); sv.off(); };
  };

  /* 3 · Полёт */
  V.fall = () => {
    const N = 18, D = 3000, rnd = (i, k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
    const nodes = Array.from({ length: N }, (_, i) => { const it = ITEMS[i % ITEMS.length], n = card(it, 'card', 150, 200);
      const ang = rnd(i, 1) * Math.PI * 2, rad = 620 + rnd(i, 2) * 520; // коридор по центру свободен
      fx.appendChild(n); return { n, x: Math.cos(ang) * rad, y: Math.sin(ang) * rad * .62, z0: -(i / N) * D }; });
    let drift = 0, extra = 0, last = performance.now(), raf;
    const wheel = e => { if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2 && e.deltaY > 0) extra += e.deltaY * 1.2; };
    addEventListener('wheel', wheel, { passive: true });
    const frame = now => { const dt = Math.min(50, now - last); last = now; if (!reduce) drift += dt * .05;
      const s = $('#contacts'), r = s.getBoundingClientRect(), p = Math.max(0, Math.min(1, -r.top / (r.height - innerHeight))), cam = p * 2600 + drift + extra;
      nodes.forEach(o => { const z = (((o.z0 + cam) % D) + D) % D - D + 420, fog = Math.min(1, Math.max(0, (z + 1700) / 1000)), near = z > 280 ? Math.max(0, 1 - (z - 280) / 140) : 1;
        o.n.style.transform = `translate3d(${o.x - 75}px,${o.y - 100}px,${z}px)`; o.n.style.opacity = (fog * near).toFixed(3); });
      raf = requestAnimationFrame(frame); };
    raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); removeEventListener('wheel', wheel); };
  };

  /* 4 · Подвес: окно «Валя.app» на лаймовой верёвке, трава снизу. Маятник: само чуть качается, скролл раскачивает */
  V.hang = () => {
    const g = img('assets/contacts-ground.webp'); g.className = 'ground'; $('.ct__pin').insertBefore(g, fx);
    const h = el('div', 'hang'), b = box(), ROPE = Math.round(b.height * .34);
    h.innerHTML = `<svg class="hang__rope" height="${ROPE + 40}" viewBox="0 0 640 ${ROPE + 40}" style="margin-bottom:-1px" aria-hidden="true">
        <path d="M320 0V${ROPE - 64}"/><path d="M320 ${ROPE - 64}L60 ${ROPE + 40}M320 ${ROPE - 64}L580 ${ROPE + 40}"/><circle cx="320" cy="${ROPE - 64}" r="4" fill="var(--lime)"/></svg>
      <div class="hang__win" style="margin-top:-2px"><div class="hang__top"><i></i><i></i><i></i><span>Валя.app</span></div>
        <div class="hang__eyes"><img id="hangEyes" alt="Глаза Вали следят за курсором" width="1172" height="294"></div><div class="hang__bot"></div></div>`;
    fx.appendChild(h); $('.hang__bot', h).appendChild(btns);
    const eyes = window.Eyes ? Eyes($('#hangEyes'), 'cursor', { idle: 3000, blinkEvery: 3000 }) : null;
    let th = 0, om = 0, t0 = performance.now(), last = t0, raf; const sv = scrollVel();
    const frame = now => { const dt = Math.min(50, now - last) / 1000; last = now;
      om += sv.take() * .0011;                                              // толчок от скролла
      const drive = reduce ? 0 : Math.sin((now - t0) / 1000 * 1.25) * .012;  // лёгкое само-раскачивание
      om += (-9 * th - 1.1 * om + drive) * dt; th += om * dt; th = Math.max(-.16, Math.min(.16, th));
      h.style.transform = `rotate(${(th * 180 / Math.PI).toFixed(3)}deg)`; raf = requestAnimationFrame(frame); };
    raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); sv.off(); eyes && eyes.destroy && eyes.destroy(); core.appendChild(btns); g.remove(); };
  };

  /* Переключение вариантов: ?v=orbit|arc|fall|hang */
  let stop = null;
  const set = v => { if (!V[v]) v = 'orbit'; if (stop) stop(); fx.innerHTML = ''; fx.style.cssText = '';
    body.className = 'v-' + v + (v === 'arc' && arcTop ? ' arc-top' : ''); stop = V[v]();
    $$('.pick [data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
    $('#arcSide').hidden = v !== 'arc'; $('#arcSide').textContent = arcTop ? 'дуга сверху' : 'дуга снизу'; $('#desc').textContent = DESC[v];
    const u = new URL(location); u.searchParams.set('v', v); if (v === 'arc') u.searchParams.set('arc', arcTop ? 'top' : 'bottom'); else u.searchParams.delete('arc'); history.replaceState(null, '', u); };
  const q = new URLSearchParams(location.search); arcTop = q.get('arc') === 'top';
  $$('.pick [data-v]').forEach(b => b.addEventListener('click', () => set(b.dataset.v)));
  $('#arcSide').addEventListener('click', () => { arcTop = !arcTop; set('arc'); });
  $('.pick__x').addEventListener('click', e => { const p = $('#pick'), m = p.classList.toggle('min'); e.currentTarget.setAttribute('aria-expanded', String(!m)); e.currentTarget.setAttribute('aria-label', m ? 'Развернуть панель' : 'Свернуть панель'); });
  set(q.get('v') || 'orbit');

  const toastEl = $('.toast'); let tt;
  const toast = m => { toastEl.textContent = m; toastEl.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('on'), 2400); };
  $$('[data-copy]').forEach(b => b.addEventListener('click', async () => { try { await navigator.clipboard.writeText(b.dataset.copy); toast('Почта скопирована: ' + b.dataset.copy); } catch { toast(b.dataset.copy); } }));
})();
</script>
</body>
